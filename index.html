    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Google Material 3 Token Simulation with Dynamic CSS Variable Support
              primary: '#4285F4', // Google Blue
              'primary-container': 'var(--color-primary-container, #D2E3FC)',
              'on-primary-container': 'var(--color-on-primary-container, #174EA6)',
              
              secondary: '#34A853', // Google Green
              'secondary-container': 'var(--color-secondary-container, #CEEAD6)',
              'on-secondary-container': 'var(--color-on-secondary-container, #0D652D)',
              
              tertiary: '#FBBC05', // Google Yellow
              'tertiary-container': '#FEF7E0',
              'on-tertiary-container': '#AF5C00',

              error: '#EA4335', // Google Red
              
              surface: 'var(--color-surface, #F8F9FA)', 
              'surface-container-low': 'var(--color-surface-container-low, #FFFFFF)',
              'surface-container': 'var(--color-surface-container, #F1F3F4)', 
              'surface-container-high': 'var(--color-surface-container-high, #E8EAED)', 
              
              'on-surface': 'var(--color-on-surface, #202124)', 
              'on-surface-variant': 'var(--color-on-surface-variant, #5F6368)', 
              outline: 'var(--color-outline, #DADCE0)', 
              'outline-variant': 'var(--color-outline-variant, #E8EAED)',
            },
            fontFamily: {
              sans: ['"Google Sans"', 'Roboto', 'Inter', 'sans-serif'],
            },
            borderRadius: {
              '4xl': '32px', // Material 3 Extra Large
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --color-surface: #F8F9FA;
        --color-surface-container-low: #FFFFFF;
        --color-surface-container: #F1F3F4;
        --color-surface-container-high: #E8EAED;
        --color-on-surface: #202124;
        --color-on-surface-variant: #5F6368;
        --color-outline: #DADCE0;
        --color-outline-variant: #E8EAED;
        --color-primary-container: #D2E3FC;
        --color-on-primary-container: #174EA6;
        --color-secondary-container: #CEEAD6;
        --color-on-secondary-container: #0D652D;
      }

      html.dark {
        --color-surface: #121316;
        --color-surface-container-low: #1E1F24;
        --color-surface-container: #282A30;
        --color-surface-container-high: #32353E;
        --color-on-surface: #E3E2E6;
        --color-on-surface-variant: #C4C6D0;
        --color-outline: #44474E;
        --color-outline-variant: #2D3038;
        --color-primary-container: #174EA6;
        --color-on-primary-container: #D2E3FC;
        --color-secondary-container: #0D652D;
        --color-on-secondary-container: #CEEAD6;
        color-scheme: dark;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      body {
        background-color: var(--color-surface);
        color: var(--color-on-surface);
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      /* Leaflet Customization */
      .leaflet-container {
        width: 100%;
        height: 100%;
        background-color: #e5e3df;
        z-index: 0;
      }
      html.dark .leaflet-container {
        background-color: #1e1f24;
      }
      .custom-marker-pin {
        background: transparent;
        border: none;
      }
    </style>
