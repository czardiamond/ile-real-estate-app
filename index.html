<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ilé — Find a space with confidence</title>
    <meta name="description" content="Discover property listings, compare spaces and contact owners with Ilé. Browse public listings without an account." />
    <meta name="theme-color" content="#f8f6f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      :root {
        color-scheme: light;
        --color-surface: #F8F6F1;
        --color-surface-container-low: #FFFEFB;
        --color-surface-container: #F0EEE7;
        --color-surface-container-high: #E6E3DA;
        --color-on-surface: #202923;
        --color-on-surface-variant: #565F59;
        --color-outline: #C8CCC4;
        --color-outline-variant: #E1E2DB;
        --color-primary: #28503F;
        --color-primary-container: #E2EBE3;
        --color-on-primary-container: #1E3B2E;
        --color-secondary: #956D37;
        --color-secondary-container: #F1E8D6;
        --color-on-secondary-container: #4D3615;
      }
      html.dark {
        color-scheme: dark;
        --color-surface: #171B18;
        --color-surface-container-low: #202622;
        --color-surface-container: #29312C;
        --color-surface-container-high: #343D37;
        --color-on-surface: #F0F0E9;
        --color-on-surface-variant: #C3CBC4;
        --color-outline: #667168;
        --color-outline-variant: #39443D;
        --color-primary: #B8D4C1;
        --color-primary-container: #314B3B;
        --color-on-primary-container: #E1F1E5;
        --color-secondary: #DAB77D;
        --color-secondary-container: #4C3D25;
        --color-on-secondary-container: #F4E5C6;
      }
      html { scroll-behavior: smooth; }
      body {
        background-color: var(--color-surface);
        color: var(--color-on-surface);
        font-family: 'DM Sans', sans-serif;
        line-height: 1.5;
        text-rendering: optimizeLegibility;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .leaflet-container { width: 100%; height: 100%; background-color: #e5e3df; z-index: 0; }
      html.dark .leaflet-container { background-color: #1e1f24; }
      .custom-marker-pin { background: transparent; border: none; }
      ::selection { background: #D6E3D7; color: #1E3B2E; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-surface text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
